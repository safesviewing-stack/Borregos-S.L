<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borregos S.L. | Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f4f4f0; --main-color: #ff2a5f; --accent-color: #00e5ff; --yellow: #fffb00; --dark: #111111; --card-bg: #ffffff; --text-dark: #111111;}
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-color); color: var(--dark); padding: 2rem; overflow-x: hidden; }
        
        .back-btn { position: fixed; top: 1rem; left: 1rem; background: var(--dark); color: #fff; padding: 0.8rem 1.5rem; text-decoration: none; font-weight: bold; font-size: 1.2rem; border: 4px solid var(--accent-color); box-shadow: 4px 4px 0px var(--accent-color); transition: transform 0.2s; z-index: 1000; }
        .back-btn:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0px var(--accent-color); background: var(--yellow); color: var(--dark); }

        .brutal-border { border: 4px solid var(--dark); box-shadow: 8px 8px 0px var(--dark); transition: transform 0.3s ease; }
        .brutal-border:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px var(--dark); }
        
        section { max-width: 1200px; margin: 4rem auto 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .section-title { font-size: 3.5rem; margin-bottom: 3rem; text-transform: uppercase; background: var(--accent-color); color: var(--text-dark); padding: 0 1rem; border: 4px solid var(--dark); transform: rotate(2deg); }
        
        /* Estilos del inventario */
        .grid-inventario { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; width: 100%; }
        .item-inventario { background: var(--card-bg); padding: 1.5rem; text-align: center; }
        .item-inventario img { width: 100%; height: 300px; object-fit: cover; border: 4px solid var(--dark); transition: transform 0.4s ease; }
        .item-inventario:hover img { transform: scale(1.05) rotate(2deg); }
        .item-inventario p { font-size: 1.5rem; font-weight: bold; margin-top: 1rem; }
        .item-inventario span { display: block; margin-top: 0.5rem; font-size: 1.1rem; color: var(--main-color); font-weight: bold; }

        .reveal { opacity: 0; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .reveal-up { transform: translateY(50px); }

        @media (max-width: 768px) {
            .section-title { font-size: 2rem; transform: none; }
            .grid-inventario { grid-template-columns: 1fr; }
            .item-inventario img { height: 250px; }
            .back-btn { font-size: 1rem; padding: 0.5rem 1rem; position: relative; display: inline-block; margin-bottom: 2rem; }
        }
    
        /* --- MODO OSCURO --- */
        body.dark-mode {
            --bg-color: #0a0a0a !important;
            --main-color: #00e5ff !important;
            --accent-color: #ff2a5f !important;
            --yellow: #7b00ff !important;
            --dark: #f4f4f0 !important;
            --card-bg: #1a1a1a !important;
            --text-dark: #ffffff !important;
            --text-light: #111111 !important;
            background-color: var(--bg-color) !important;
            color: var(--dark) !important;
        }
        .theme-control {
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 2000;
            background: var(--card-bg); color: var(--dark); border: 3px solid var(--dark);
            padding: 0.5rem 1rem; font-family: 'Space Grotesk', sans-serif;
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark); transition: all 0.3s ease;
        }
        .theme-control:hover { background: var(--yellow); color: var(--text-dark); transform: translate(-2px,-2px); box-shadow: 6px 6px 0px var(--main-color); }
        @media (max-width: 768px) { .theme-control { top: 0.8rem; right: 0.8rem; padding: 0.4rem 0.8rem; font-size: 1rem; } }
    </style>
</head>
<body>

    <button class="theme-control" id="themeBtn" onclick="toggleTheme()">🌚</button>


    <a href="index.html" class="back-btn">← VOLVER AL REDIL</a>

    <section id="inventario">
        <h2 class="section-title reveal reveal-up">Inventario</h2>
        <div class="grid-inventario reveal reveal-up">
            <div class="item-inventario brutal-border">
               <img src="11.jpg" alt="Semáforo">
                <p>Semáforo</p>
                <span>Obtenido: 23/02/2026</span>
            </div>
            <!-- Puedes añadir más objetos copiando el bloque de arriba -->
        </div>
    </section>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('active'); });
        });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
<script>
        // MODO OSCURO PERSISTENTE ENTRE TODAS LAS PÁGINAS
        function aplicarTema() {
            const dark = localStorage.getItem('borregos_dark_mode') === 'true';
            document.body.classList.toggle('dark-mode', dark);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.innerText = dark ? '🌞' : '🌚';
        }
        function toggleTheme() {
            const dark = !document.body.classList.contains('dark-mode');
            document.body.classList.toggle('dark-mode', dark);
            localStorage.setItem('borregos_dark_mode', dark);
            document.getElementById('themeBtn').innerText = dark ? '🌞' : '🌚';
        }
        aplicarTema();
    </script>
</body>
</html>
