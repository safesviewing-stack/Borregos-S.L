<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Borregos S.L. | Juegos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f4f4f0; --main-color: #ff2a5f; --dark: #111111; --yellow: #fffb00; --card-bg: #ffffff; --text-dark: #111111; --text-light: #ffffff;}
        body { margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-color); color: var(--dark); overflow: hidden; touch-action: none; }
        
        /* Botón volver */
        .back-btn { position: fixed; top: 1rem; left: 1rem; background: var(--dark); color: var(--text-light); padding: 0.5rem 1rem; text-decoration: none; font-weight: bold; border: 3px solid var(--main-color); z-index: 100; box-shadow: 4px 4px 0px var(--main-color); font-size: clamp(0.8rem, 3vw, 1rem); }
        
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #87CEEB; }
        
        .game-ui { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 10; width: 90%; }
        h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0; text-shadow: 4px 4px 0px var(--yellow); border: 4px solid var(--dark); background: var(--card-bg); color: var(--text-dark); padding: 1rem; transform: rotate(-2deg); }
        p { font-size: clamp(1rem, 4vw, 1.5rem); background: var(--dark); color: var(--text-light); padding: 0.5rem; display: inline-block; margin-top: 1rem; }
    
        /* --- MODO OSCURO --- */
        body.dark-mode {
            --bg-color: #0a0a0a !important;
            --main-color: #00e5ff !important;
            --accent-color: #ff2a5f !important;
            --yellow: #7b00ff !important;
            --dark: #f4f4f0 !important;
            --card-bg: #1a1a1a !important;
            --text-dark: #ffffff !important;
            --text-light: #111111 !important;
            background-color: var(--bg-color) !important;
            color: var(--dark) !important;
        }
        .theme-control {
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 2000;
            background: var(--card-bg); color: var(--dark); border: 3px solid var(--dark);
            padding: 0.5rem 1rem; font-family: 'Space Grotesk', sans-serif;
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark); transition: all 0.3s ease;
        }
        .theme-control:hover { background: var(--yellow); color: var(--text-dark); transform: translate(-2px,-2px); box-shadow: 6px 6px 0px var(--main-color); }
        @media (max-width: 768px) { .theme-control { top: 0.8rem; right: 0.8rem; padding: 0.4rem 0.8rem; font-size: 1rem; } }
    </style>
</head>
<body>

    <button class="theme-control" id="themeBtn" onclick="toggleTheme()">🌚</button>

    <a href="index.html" class="back-btn">← VOLVER AL CAOS</a>
    
    <div class="game-ui" id="startScreen">
        <h1>FLAPPY BORREGO</h1>
        <p>Toca la pantalla para saltar</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        
        // Ajustar canvas a la pantalla dinámica
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const caras = ['Samu.jpg', 'David.jpg', 'Ignacio.jpg', 'Frank.jpg', 'Jos.jpg', 'Miguel.jpg', 'Luis.jpg', 'Pablo.jpg', 'Leandro.jpg', 'Adrian.jpg', 'Cobarde1.jpg', 'Cobarde2.jpg', 'Ruben.jpg'];
        
        let borregoImg = new Image();
        function setRandomFace() {
            const randomFace = caras[Math.floor(Math.random() * caras.length)];
            borregoImg.src = randomFace;
        }
        setRandomFace();

        // Variables del juego
        let frames = 0;
        let gameActive = false;
        let score = 0;

        // Variables escaladas relativas al tamaño de pantalla (para Móvil / PC)
        const getScale = () => Math.min(canvas.width / 400, 1.5);
        const getBirdSize = () => Math.max(30, canvas.width * 0.08);

        const bird = {
            x: 0, y: 0, width: 0, height: 0,
            gravity: 0, lift: 0, velocity: 0,
            init: function() {
                this.width = getBirdSize();
                this.height = getBirdSize();
                this.x = canvas.width * 0.15;
                this.y = canvas.height / 2;
                this.gravity = canvas.height * 0.0008; // Gravedad dinámica
                this.lift = -canvas.height * 0.012;    // Salto dinámico
                this.velocity = 0;
            },
            draw: function() {
                ctx.font = `${this.height}px Arial`;
                ctx.fillText("🐑", this.x - (this.width * 0.2), this.y + (this.height * 0.85));
                if(borregoImg.complete) {
                    ctx.drawImage(borregoImg, this.x, this.y, this.width, this.height);
                }
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                if(this.y + this.height >= canvas.height) { this.y = canvas.height - this.height; gameActive = false; }
                if(this.y <= 0) { this.y = 0; this.velocity = 0; }
            },
            jump: function() { this.velocity = this.lift; }
        };

        const pipes = {
            array: [], 
            width: 0, 
            gap: 0, 
            dx: 0,
            init: function() {
                this.array = [];
                this.width = Math.max(50, canvas.width * 0.12);
                this.gap = getBirdSize() * 4.5; // Hueco más fácil en móvil
                this.dx = canvas.width * 0.007; // Velocidad de avance adaptativa
            },
            draw: function() {
                for(let i=0; i<this.array.length; i++) {
                    let p = this.array[i];
                    ctx.fillStyle = "#228B22"; 
                    ctx.fillRect(p.x, 0, this.width, p.top);
                    ctx.fillRect(p.x, canvas.height - p.bottom, this.width, p.bottom);
                    
                    ctx.strokeStyle = "#111"; ctx.lineWidth = 4;
                    ctx.strokeRect(p.x, 0, this.width, p.top);
                    ctx.strokeRect(p.x, canvas.height - p.bottom, this.width, p.bottom);
                }
            },
            update: function() {
                // Generar nueva tubería
                if(frames % Math.floor(120 / getScale()) === 0) { 
                    let minHeight = 50;
                    let maxTop = canvas.height - this.gap - minHeight;
                    let top = Math.random() * (maxTop - minHeight) + minHeight;
                    let bottom = canvas.height - (top + this.gap);
                    this.array.push({x: canvas.width, top: top, bottom: bottom});
                }
                for(let i=0; i<this.array.length; i++) {
                    let p = this.array[i];
                    p.x -= this.dx;
                    // Colisiones
                    if(bird.x < p.x + this.width && bird.x + bird.width > p.x && 
                      (bird.y < p.top || bird.y + bird.height > canvas.height - p.bottom)) {
                        gameActive = false; 
                    }
                    if(p.x + this.dx >= bird.x && p.x < bird.x) { score++; } // Puntuación corregida
                    if(p.x + this.width < 0) { this.array.shift(); i--; }
                }
            }
        };

        function drawScore() {
            ctx.fillStyle = "#111";
            ctx.font = "900 40px 'Space Grotesk'";
            ctx.fillText("Puntos: " + score, 20, 80);
        }

        // Limitador a 60 FPS (Arregla pantallas de 120Hz en móviles nuevos)
        let lastTime = 0;
        const targetFPS = 60;
        const frameInterval = 1000 / targetFPS;

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            
            if (!lastTime) lastTime = timestamp;
            let deltaTime = timestamp - lastTime;
            
            // Solo dibujamos si ha pasado el tiempo para 60fps
            if (deltaTime >= frameInterval) {
                lastTime = timestamp - (deltaTime % frameInterval);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if(gameActive) {
                    bird.update();
                    pipes.update();
                    frames++;
                }
                bird.draw();
                pipes.draw();
                drawScore();
                
                if(!gameActive && frames > 0) {
                    startScreen.style.display = 'block';
                    startScreen.querySelector('h1').innerText = "¡TE HAS ESTAMPADO!";
                    startScreen.querySelector('p').innerText = "Toca para reiniciar";
                }
            }
        }

        function action(e) {
            if(e) e.preventDefault(); // Evitar zoom nativo por doble toque
            if(!gameActive) {
                bird.init();
                pipes.init();
                gameActive = true;
                startScreen.style.display = 'none';
                score = 0;
                frames = 0;
                setRandomFace(); 
            }
            bird.jump();
        }

        window.addEventListener('touchstart', action, {passive: false});
        window.addEventListener('mousedown', action);

        // Inicializar posiciones base
        bird.init();
        pipes.init();
        requestAnimationFrame(gameLoop);
    </script>
    <script>
        function aplicarTema() {
            const dark = localStorage.getItem('borregos_dark_mode') === 'true';
            document.body.classList.toggle('dark-mode', dark);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.innerText = dark ? '🌞' : '🌚';
        }
        function toggleTheme() {
            const dark = !document.body.classList.contains('dark-mode');
            document.body.classList.toggle('dark-mode', dark);
            localStorage.setItem('borregos_dark_mode', dark);
            document.getElementById('themeBtn').innerText = dark ? '🌞' : '🌚';
        }
        aplicarTema();
    </script>
</body>
</html>
