<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Borregos S.L. | Juegos</title>
    
    <!-- FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           VARIABLES Y CONFIGURACIÓN BASE
           ========================================== */
        :root { 
            --bg-color: #f4f4f0; 
            --main-color: #ff2a5f; 
            --accent-color: #00e5ff; 
            --yellow: #fffb00; 
            --dark: #111111; 
            --card-bg: #ffffff; 
            --text-dark: #111111; 
            --text-light: #ffffff;
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--dark); 
            overflow: hidden; 
            touch-action: none; 
        }
        
        /* ==========================================
           BOTONES PRINCIPALES
           ========================================== */
        .back-btn { 
            position: fixed; 
            top: 1rem; 
            left: 1rem; 
            background: var(--dark); 
            color: var(--text-light); 
            padding: 0.8rem 1.5rem; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1.2rem; 
            border: 4px solid var(--yellow); 
            box-shadow: 4px 4px 0px var(--yellow); 
            transition: transform 0.2s; 
            z-index: 1000; 
        }

        .back-btn:hover { 
            transform: translate(-4px, -4px); 
            box-shadow: 8px 8px 0px var(--yellow); 
            background: var(--main-color); 
        }
        
        /* ==========================================
           MODO OSCURO Y CONTROLES
           ========================================== */
        body.dark-mode { 
            --bg-color: #0a0a0a; 
            --main-color: #00e5ff; 
            --accent-color: #ff2a5f; 
            --yellow: #7b00ff; 
            --dark: #f4f4f0; 
            --card-bg: #1a1a1a; 
            --text-dark: #ffffff; 
            --text-light: #111111; 
            
            background-color: var(--bg-color); 
            color: var(--dark); 
        }

        .theme-control { 
            position: fixed; 
            top: 1rem; 
            right: 1rem; 
            z-index: 2000; 
            background: var(--card-bg); 
            color: var(--dark); 
            border: 3px solid var(--dark); 
            padding: 0.5rem 1rem; 
            font-weight: 900; 
            font-size: 1.2rem; 
            cursor: pointer; 
            box-shadow: 4px 4px 0px var(--dark); 
            transition: all 0.3s ease; 
        }

        .theme-control:hover { 
            background: var(--yellow); 
            color: var(--text-dark); 
            transform: translate(-2px, -2px); 
            box-shadow: 6px 6px 0px var(--main-color); 
        }

        /* ==========================================
           LIENZO (CANVAS)
           ========================================== */
        #gameCanvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            background: #87CEEB; 
            transition: background 0.3s; 
        }

        body.dark-mode #gameCanvas { 
            background: #1a2332; 
        } 
        
        /* ==========================================
           INTERFAZ DE USUARIO (UI)
           ========================================== */
        .score-display { 
            position: fixed; 
            bottom: 1.5rem; 
            right: 1.5rem; 
            z-index: 100; 
            background: rgba(255, 255, 255, 0.9); 
            color: #111; 
            border: 3px solid #111; 
            border-radius: 8px; 
            padding: 0.4rem 0.8rem; 
            font-weight: 900; 
            font-size: 1.2rem; 
            pointer-events: none; 
            box-shadow: 3px 3px 0px #111; 
        }
        
        .game-ui { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center; 
            z-index: 10; 
            width: 90%; 
            max-width: 400px; 
            max-height: 90vh; 
            overflow-y: auto; 
            padding: 1rem; 
        }

        h1 { 
            font-size: clamp(2rem, 8vw, 3.5rem); 
            margin: 0; 
            text-shadow: 4px 4px 0px var(--yellow); 
            border: 4px solid var(--dark); 
            background: var(--card-bg); 
            color: var(--text-dark); 
            padding: 1rem; 
            transform: rotate(-2deg); 
        }

        .input-group { 
            margin-top: 2rem; 
            display: flex; 
            flex-direction: column; 
            gap: 1rem; 
            align-items: center; 
        }

        .input-group input { 
            padding: 1rem; 
            font-size: 1.2rem; 
            font-family: 'Space Grotesk', sans-serif; 
            border: 4px solid var(--dark); 
            width: 100%; 
            max-width: 250px; 
            text-align: center; 
            font-weight: bold; 
            outline: none; 
            box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.1); 
        }

        .btn-jugar { 
            background: var(--yellow); 
            color: var(--text-dark); 
            padding: 1rem 2rem; 
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.5rem; 
            font-weight: 900; 
            border: 4px solid var(--dark); 
            cursor: pointer; 
            box-shadow: 4px 4px 0px var(--dark); 
            transition: transform 0.2s, box-shadow 0.2s; 
            width: 100%; 
            max-width: 250px; 
        }

        .btn-jugar:active { 
            transform: translate(2px, 2px); 
            box-shadow: 0px 0px 0px var(--dark); 
        }

        /* ==========================================
           TABLA DE CLASIFICACIÓN
           ========================================== */
        .leaderboard { 
            margin-top: 2rem; 
            background: var(--card-bg); 
            border: 4px solid var(--dark); 
            padding: 1.5rem; 
            box-shadow: 6px 6px 0px var(--main-color); 
        }

        .leaderboard h3 { 
            margin: 0 0 1rem 0; 
            font-size: 1.5rem; 
            color: var(--dark); 
            text-transform: uppercase; 
            border-bottom: 3px solid var(--dark); 
            padding-bottom: 0.5rem;
        }

        .leaderboard ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            text-align: left; 
        }

        .leaderboard li { 
            font-weight: bold; 
            font-size: 1.1rem; 
            border-bottom: 2px dashed #ccc; 
            padding: 0.5rem 0; 
            display: flex; 
            justify-content: space-between; 
        }

        .leaderboard li:last-child { 
            border-bottom: none; 
        }

        .leaderboard li span.score-val { 
            color: var(--main-color); 
            font-size: 1.2rem; 
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 768px) {
            .back-btn { 
                font-size: 1rem; 
                padding: 0.5rem 1rem; 
                top: 0.8rem; 
                left: 0.8rem; 
            }
            .theme-control { 
                top: 0.8rem; 
                right: 0.8rem; 
                padding: 0.4rem 0.8rem; 
                font-size: 1rem; 
            }
            .score-display { 
                bottom: 1rem; 
                right: 1rem; 
                font-size: 1rem; 
                padding: 0.3rem 0.6rem; 
            }
        }
    </style>
</head>
<body>
    
    <!-- CONTROLES SUPERIORES -->
    <a href="index.html" class="back-btn">← VOLVER AL REDIL</a>
    <button class="theme-control" id="themeBtn" onclick="toggleTheme()">🌚</button>

    <!-- PUNTUACIÓN -->
    <div id="scoreDisplay" class="score-display">PUNTOS: 0</div>

    <!-- PANTALLA DE INICIO -->
    <div class="game-ui" id="startScreen">
        
        <h1 id="mainTitle">FLAPPY OVEJA</h1>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Tu nombre..." maxlength="12" autocomplete="off">
            <button class="btn-jugar" id="startBtn">¡JUGAR!</button>
        </div>
        
        <div class="leaderboard">
            <h3>🏆 Mejores Borregos</h3>
            <ul id="leaderboardList"></ul>
        </div>

    </div>

    <!-- LIENZO DEL JUEGO -->
    <canvas id="gameCanvas"></canvas>

    <script>
        /* ==========================================
           GESTIÓN DEL MODO OSCURO
           ========================================== */
        
        function aplicarTema() {
            const isDark = localStorage.getItem('borregos_dark_mode') === 'true';
            
            if (isDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerText = '🌞';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeBtn').innerText = '🌚';
            }
        }

        function toggleTheme() {
            const bodyHasDark = document.body.classList.contains('dark-mode');
            const newDarkState = !bodyHasDark;
            
            if (newDarkState) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('borregos_dark_mode', 'true');
                document.getElementById('themeBtn').innerText = '🌞';
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('borregos_dark_mode', 'false');
                document.getElementById('themeBtn').innerText = '🌚';
            }
        }
        
        // Aplicamos el tema nada más cargar la página
        aplicarTema();


        /* ==========================================
           VARIABLES GLOBALES Y REFERENCIAS DOM
           ========================================== */
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const ui = document.getElementById('startScreen');
        const scoreUI = document.getElementById('scoreDisplay');
        const pName = document.getElementById('playerName');
        const btn = document.getElementById('startBtn');
        const list = document.getElementById('leaderboardList');
        
        let width;
        let height;
        let frames = 0;
        let gameActive = false;
        let score = 0;
        let player = "";
        let lastTime = 0;
        
        // Imagen de la oveja
        let img = new Image(); 
        img.src = 'ovejita.png';


        /* ==========================================
           UTILIDADES Y REDIMENSIONAMIENTO
           ========================================== */

        function getScale() {
            return Math.min(width / 400, 1.5);
        }
        
        function getBirdSize() {
            return Math.max(30, width * 0.08);
        }

        function resize() {
            width = window.innerWidth; 
            height = window.innerHeight;
            
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = width * dpr; 
            canvas.height = height * dpr;
            
            canvas.style.width = width + 'px'; 
            canvas.style.height = height + 'px';
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        
        window.addEventListener('resize', resize); 
        resize();


        /* ==========================================
           ENTIDAD: OVEJA (BIRD)
           ========================================== */
        
        const bird = {
            
            init: function() { 
                this.s = getBirdSize(); 
                this.x = width * 0.15; 
                this.y = height / 2; 
                
                // Gravedad y fuerza de salto
                this.g = height * 0.0008; 
                this.l = -height * 0.011; 
                
                this.v = 0; 
            },
            
            draw: function() {
                if (img.complete) {
                    ctx.save(); 
                    ctx.translate(this.x + this.s, 0); 
                    ctx.scale(-1, 1);
                    
                    // Ajustamos las coordenadas de la imagen
                    const imageX = -this.s - (this.s * 0.1);
                    const imageY = this.y - (this.s * 0.1);
                    const imageWidth = this.s * 1.2;
                    const imageHeight = this.s * 1.2;
                    
                    ctx.drawImage(img, imageX, imageY, imageWidth, imageHeight); 
                    
                    ctx.restore();
                    
                } else { 
                    // Si no carga la imagen, dibujamos un cuadrado blanco
                    ctx.fillStyle = "white"; 
                    ctx.fillRect(this.x, this.y, this.s, this.s); 
                }
            },
            
            update: function() {
                // Aplicar gravedad a la velocidad
                this.v = this.v + this.g; 
                
                // Aplicar velocidad a la posición Y
                this.y = this.y + this.v;
                
                // Comprobar colisión con el suelo
                if (this.y + this.s >= height) { 
                    this.y = height - this.s; 
                    die(); 
                }
                
                // Comprobar colisión con el techo
                if (this.y <= 0) { 
                    this.y = 0; 
                    this.v = 0; 
                }
            },
            
            jump: function() { 
                this.v = this.l; 
            }
        };


        /* ==========================================
           ENTIDAD: TUBERÍAS (PIPES)
           ========================================== */
        
        const pipes = {
            arr: [], 
            w: 0, 
            gap: 0, 
            dx: 0,
            
            init: function() { 
                this.arr = []; 
                this.w = Math.max(50, width * 0.12); 
                this.gap = getBirdSize() * 4.5; 
                this.dx = width * 0.007; 
            },
            
            draw: function() {
                for (let i = 0; i < this.arr.length; i++) {
                    const p = this.arr[i];
                    
                    // Tubo superior
                    ctx.fillStyle = "#22c55e"; 
                    ctx.fillRect(p.x, 0, this.w, p.top); 
                    
                    ctx.strokeStyle = "#111"; 
                    ctx.lineWidth = 4; 
                    ctx.strokeRect(p.x, 0, this.w, p.top); 
                    
                    // Tubo inferior
                    const bottomY = height - p.bot;
                    
                    ctx.fillStyle = "#22c55e"; 
                    ctx.fillRect(p.x, bottomY, this.w, p.bot);
                    
                    ctx.strokeStyle = "#111"; 
                    ctx.lineWidth = 4; 
                    ctx.strokeRect(p.x, bottomY, this.w, p.bot);
                }
            },
            
            update: function() {
                
                // 1. Generar nuevas tuberías
                const framesThreshold = Math.floor(120 / getScale());
                
                if (frames % framesThreshold === 0) { 
                    
                    const maxTop = height - this.gap - 100;
                    const topHeight = (Math.random() * maxTop) + 50;
                    const bottomHeight = height - (topHeight + this.gap);
                    
                    this.arr.push({
                        x: width, 
                        top: topHeight, 
                        bot: bottomHeight, 
                        passed: false
                    });
                }
                
                // 2. Mover tuberías y detectar colisiones
                for (let i = 0; i < this.arr.length; i++) {
                    let p = this.arr[i]; 
                    
                    // Mover la tubería hacia la izquierda
                    p.x = p.x - this.dx;
                    
                    // Variables para la colisión
                    const tocandoEjeX = (bird.x < p.x + this.w) && (bird.x + bird.s > p.x);
                    const tocandoTuboSuperior = (bird.y < p.top);
                    const tocandoTuboInferior = (bird.y + bird.s > height - p.bot);
                    
                    // Condición de colisión
                    if (tocandoEjeX && (tocandoTuboSuperior || tocandoTuboInferior)) {
                        die(); 
                    }
                    
                    // Condición para sumar puntos (pasar la tubería)
                    if (p.passed === false && (p.x + this.w < bird.x)) { 
                        score = score + 1; 
                        scoreUI.innerText = "PUNTOS: " + score; 
                        p.passed = true; 
                    } 
                    
                    // Eliminar tuberías que salen de la pantalla
                    if (p.x + this.w < 0) { 
                        this.arr.shift(); 
                        i = i - 1; 
                    }
                }
            }
        };


        /* ==========================================
           TABLA DE CLASIFICACIÓN (LEADERBOARD)
           ========================================== */

        function renderLeaderboard() {
            const data = localStorage.getItem('flappy_borrego_scores');
            let board = [];
            
            if (data) {
                board = JSON.parse(data);
            }
            
            if (board.length > 0) {
                
                let htmlContent = '';
                
                for (let i = 0; i < board.length; i++) {
                    const entry = board[i];
                    htmlContent += `<li>
                                        <span>${i + 1}. ${entry.name}</span>
                                        <span class="score-val">${entry.score}</span>
                                    </li>`;
                }
                
                list.innerHTML = htmlContent;
                
            } else {
                list.innerHTML = "<li>Aún no hay puntuaciones.</li>";
            }
        }
        
        // Pintar tabla al inicio
        renderLeaderboard();


        /* ==========================================
           LÓGICA DE FIN DE JUEGO (GAME OVER)
           ========================================== */

        function die() {
            // Evitar que la función se llame múltiples veces
            if (gameActive === false) {
                return; 
            }
            
            gameActive = false;
            
            // Obtener puntuaciones actuales
            const data = localStorage.getItem('flappy_borrego_scores');
            let board = [];
            
            if (data) {
                board = JSON.parse(data);
            }
            
            // Añadir la nueva puntuación
            const currentName = player !== "" ? player : "Anónimo";
            
            board.push({ 
                name: currentName, 
                score: score 
            });
            
            // Ordenar de mayor a menor puntuación
            board.sort(function(a, b) {
                return b.score - a.score;
            });
            
            // Quedarnos solo con el Top 10
            board = board.slice(0, 10);
            
            // Guardar en LocalStorage
            localStorage.setItem('flappy_borrego_scores', JSON.stringify(board));
            
            // Refrescar UI
            renderLeaderboard();
            
            document.getElementById('mainTitle').innerText = "¡TE HAS ESTAMPADO!";
            ui.style.display = 'block';
        }


        /* ==========================================
           BUCLE PRINCIPAL (GAME LOOP)
           ========================================== */

        function loop(timestamp) {
            
            requestAnimationFrame(loop);
            
            if (lastTime === 0) {
                lastTime = timestamp;
            }
            
            const deltaTime = timestamp - lastTime;
            const targetFPS = 1000 / 60; // 60 fotogramas por segundo
            
            if (deltaTime >= targetFPS) {
                
                lastTime = timestamp - (deltaTime % targetFPS);
                
                // Limpiar la pantalla completa
                ctx.clearRect(0, 0, width, height);
                
                // Solo actualizamos físicas si el juego está activo
                if (gameActive === true) { 
                    bird.update(); 
                    pipes.update(); 
                    frames = frames + 1; 
                }
                
                // Dibujamos siempre (activo o parado)
                bird.draw(); 
                pipes.draw();
            }
        }


        /* ==========================================
           EVENTOS (CONTROLES E INTERFAZ)
           ========================================== */

        btn.addEventListener('click', function() {
            
            player = pName.value.trim();
            
            if (player === "") {
                alert("¡Pon tu nombre para jugar!");
                return;
            }
            
            // Reiniciar juego
            bird.init(); 
            pipes.init();
            
            gameActive = true; 
            
            ui.style.display = 'none';
            
            score = 0; 
            scoreUI.innerText = "PUNTOS: 0"; 
            
            frames = 0;
            
            // Primer salto automático
            bird.jump();
        });

        function handleInput(event) { 
            
            const isClickingUI = event.target.closest('.back-btn, .theme-control, .game-ui');
            
            if (!isClickingUI && gameActive === true) { 
                event.preventDefault(); 
                bird.jump(); 
            }
        }
        
        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('mousedown', handleInput);


        /* ==========================================
           ARRANQUE INICIAL
           ========================================== */
           
        bird.init(); 
        pipes.init(); 
        
        requestAnimationFrame(loop);

    </script>
</body>
</html>
