<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borregos S.L. | Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f4f4f0; --main-color: #ff2a5f; --accent-color: #00e5ff; --yellow: #fffb00; --dark: #111111; --card-bg: #ffffff; --text-dark: #111111; --text-light: #ffffff;}
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-color); color: var(--dark); padding: 2rem; overflow-x: hidden; }
        
        .back-btn { position: fixed; top: 1rem; left: 1rem; background: var(--dark); color: var(--text-light); padding: 0.8rem 1.5rem; text-decoration: none; font-weight: bold; font-size: 1.2rem; border: 4px solid var(--yellow); box-shadow: 4px 4px 0px var(--yellow); transition: transform 0.2s; z-index: 1000; }
        .back-btn:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0px var(--yellow); background: var(--main-color); }

        .brutal-border { border: 4px solid var(--dark); box-shadow: 8px 8px 0px var(--dark); transition: transform 0.3s ease; }
        
        section { max-width: 1200px; margin: 4rem auto 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .section-title { font-size: 3.5rem; margin-bottom: 3rem; text-transform: uppercase; background: var(--main-color); color: var(--text-light); padding: 0 1rem; border: 4px solid var(--dark); transform: rotate(-2deg); text-shadow: 4px 4px 0px var(--dark);}
        
        /* Estilos del Carrusel del Blog */
        .carousel-wrapper { position: relative; padding: 2rem; background: var(--card-bg); overflow: hidden; width: 100%; }
        .carousel { display: flex; gap: 1.5rem; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .carousel-item { min-width: 80%; height: 750px; background-size: cover; background-position: center; border: 4px solid var(--dark); flex-shrink: 0; transition: transform 0.3s ease; }
        .carousel-item:hover { transform: scale(1.02); }

        /* Botones del Carrusel */
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--yellow); border: 4px solid var(--dark); font-size: 3rem; font-weight: 900; padding: 0.5rem 1rem; cursor: pointer; z-index: 5; box-shadow: 6px 6px 0 var(--dark); }
        .carousel-btn.left { left: 1rem; }
        .carousel-btn.right { right: 1rem; }
        .carousel-btn:hover { transform: translateY(-50%) scale(1.05); }

        .reveal { opacity: 0; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .reveal-up { transform: translateY(50px); }

        @media (max-width: 768px) {
            .section-title { font-size: 2rem; transform: none; }
            .carousel-wrapper { padding: 1rem; }
            .carousel-item { min-width: 92%; height: 400px; }
            .carousel-btn { display: none; } /* En móvil se usa el dedo para deslizar */
            .back-btn { font-size: 1rem; padding: 0.5rem 1rem; position: relative; display: inline-block; margin-bottom: 2rem; }
        }
    
        /* --- MODO OSCURO --- */
        body.dark-mode {
            --bg-color: #0a0a0a !important;
            --main-color: #00e5ff !important;
            --accent-color: #ff2a5f !important;
            --yellow: #7b00ff !important;
            --dark: #f4f4f0 !important;
            --card-bg: #1a1a1a !important;
            --text-dark: #ffffff !important;
            --text-light: #111111 !important;
            background-color: var(--bg-color) !important;
            color: var(--dark) !important;
        }
        .theme-control {
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 2000;
            background: var(--card-bg); color: var(--dark); border: 3px solid var(--dark);
            padding: 0.5rem 1rem; font-family: 'Space Grotesk', sans-serif;
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark); transition: all 0.3s ease;
        }
        .theme-control:hover { background: var(--yellow); color: var(--text-dark); transform: translate(-2px,-2px); box-shadow: 6px 6px 0px var(--main-color); }
        @media (max-width: 768px) { .theme-control { top: 0.8rem; right: 0.8rem; padding: 0.4rem 0.8rem; font-size: 1rem; } }
    </style>
</head>
<body>

    <button class="theme-control" id="themeBtn" onclick="toggleTheme()">🌚</button>


    <a href="index.html" class="back-btn">← VOLVER AL REDIL</a>

    <section id="blog">
      <h2 class="section-title reveal reveal-up">Archivos / Blog</h2>

      <div class="carousel-wrapper brutal-border reveal reveal-up">
        <button class="carousel-btn left" onclick="scrollCarousel(-1)">‹</button>

        <div class="carousel" id="blogCarousel">
          <div class="carousel-item" style="background-image:url('1.jpg')"></div>
          <div class="carousel-item" style="background-image:url('2.jpg')"></div>
          <div class="carousel-item" style="background-image:url('3.jpg')"></div>
          <div class="carousel-item" style="background-image:url('4.jpg')"></div>
          <div class="carousel-item" style="background-image:url('5.jpg')"></div>
          <div class="carousel-item" style="background-image:url('6.jpg')"></div>
          <div class="carousel-item" style="background-image:url('8.jpg')"></div>
          <div class="carousel-item" style="background-image:url('9.jpg')"></div>
          <div class="carousel-item" style="background-image:url('10.jpg')"></div>
          <div class="carousel-item" style="background-image:url('12.jpg')"></div>
          <div class="carousel-item" style="background-image:url('13.jpg')"></div>
          <div class="carousel-item" style="background-image:url('14.jpg')"></div>
          <div class="carousel-item" style="background-image:url('15.jpg')"></div>
          <div class="carousel-item" style="background-image:url('16.jpg')"></div>
        </div>

        <button class="carousel-btn right" onclick="scrollCarousel(1)">›</button>
      </div>
    </section>

    <script>
        // Efecto para que los elementos aparezcan al hacer scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('active'); });
        });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Función para mover el carrusel con los botones en PC
        function scrollCarousel(direction) {
          const carousel = document.getElementById('blogCarousel');
          const scrollAmount = carousel.offsetWidth * 0.9;
          carousel.scrollBy({ left: scrollAmount * direction, behavior: 'smooth' });
        }
    </script>
<script>
        // MODO OSCURO PERSISTENTE ENTRE TODAS LAS PÁGINAS
        function aplicarTema() {
            const dark = localStorage.getItem('borregos_dark_mode') === 'true';
            document.body.classList.toggle('dark-mode', dark);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.innerText = dark ? '🌞' : '🌚';
        }
        function toggleTheme() {
            const dark = !document.body.classList.contains('dark-mode');
            document.body.classList.toggle('dark-mode', dark);
            localStorage.setItem('borregos_dark_mode', dark);
            document.getElementById('themeBtn').innerText = dark ? '🌞' : '🌚';
        }
        aplicarTema();
    </script>
</body>
</html>
