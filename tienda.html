<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borregos S.L. | Tienda 🛒</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           VARIABLES Y CONFIGURACIÓN BASE
           ========================================== */
        :root { 
            --bg-color: #f4f4f0; 
            --main-color: #ff2a5f; 
            --accent-color: #00e5ff; 
            --yellow: #fffb00; 
            --dark: #111111; 
            --card-bg: #ffffff; 
            --text-dark: #111111; 
            --text-light: #ffffff; 
        }

        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--dark); 
            margin: 0; 
            padding: 2rem; 
        }
        
        /* ==========================================
           MODO OSCURO (Forzado con !important)
           ========================================== */
        body.dark-mode {
            --bg-color: #0a0a0a !important;
            --main-color: #00e5ff !important;
            --accent-color: #ff2a5f !important;
            --yellow: #7b00ff !important;
            --dark: #f4f4f0 !important;
            --card-bg: #1a1a1a !important;
            --text-dark: #ffffff !important;
            --text-light: #111111 !important;
            
            background-color: var(--bg-color) !important;
            color: var(--dark) !important;
        }

        /* ==========================================
           BOTONES SUPERIORES (Volver y Tema)
           ========================================== */
        .back-btn { 
            display: inline-block; 
            margin-bottom: 2rem; 
            background: var(--dark); 
            color: var(--text-light); 
            padding: 0.8rem 1.5rem; 
            text-decoration: none; 
            font-weight: bold; 
            border: 4px solid var(--main-color); 
            box-shadow: 4px 4px 0px var(--main-color); 
            transition: transform 0.2s; 
        }

        .back-btn:hover { 
            transform: translate(-4px, -4px); 
            box-shadow: 8px 8px 0px var(--main-color); 
        }

        .theme-control {
            position: fixed; 
            top: 1.5rem; 
            right: 1.5rem; 
            z-index: 2000;
            background: var(--card-bg); 
            color: var(--dark); 
            border: 3px solid var(--dark);
            padding: 0.5rem 1rem; 
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900; 
            font-size: 1.2rem; 
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark); 
            transition: all 0.3s ease;
        }

        .theme-control:hover { 
            background: var(--yellow); 
            color: var(--text-dark); 
            transform: translate(-2px, -2px); 
            box-shadow: 6px 6px 0px var(--main-color); 
        }

        /* ==========================================
           CABECERA Y CARTEL DE "EN OBRAS"
           ========================================== */
        .header-tienda { 
            text-align: center; 
            margin-bottom: 3rem; 
        }

        h1 { 
            font-size: clamp(2.5rem, 8vw, 5rem); 
            text-transform: uppercase; 
            display: inline-block; 
            background: var(--yellow); 
            border: 4px solid var(--dark); 
            padding: 0.5rem 2rem; 
            transform: rotate(-2deg); 
            box-shadow: 8px 8px 0px var(--dark); 
        }

        .subtitulo {
            margin-top: 1.5rem; 
            font-size: 1.2rem; 
            font-weight: bold;
        }

        .cartel-obras {
            background: var(--accent-color);
            color: var(--text-dark);
            border: 4px dashed var(--dark);
            padding: 2.5rem 1.5rem;
            margin: 4rem auto;
            max-width: 600px;
            font-size: 1.5rem;
            font-weight: 900;
            transform: rotate(1deg);
            box-shadow: 6px 6px 0px var(--dark);
        }

        /* ==========================================
           GRID DE PRODUCTOS (Estilos guardados para el futuro)
           ========================================== */
        .grid-tienda { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 2rem; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding-bottom: 4rem;
        }
        
        .producto { 
            background: var(--card-bg); 
            border: 4px solid var(--dark); 
            padding: 1.5rem; 
            text-align: center; 
            box-shadow: 8px 8px 0px var(--dark); 
            transition: transform 0.3s; 
        }

        .producto:hover { 
            transform: translate(-4px, -4px); 
            box-shadow: 12px 12px 0px var(--main-color); 
            background: var(--bg-color); 
        }

        .producto .img-placeholder { 
            width: 100%; 
            height: 200px; 
            background: var(--card-bg); 
            color: var(--dark); 
            border: 4px solid var(--dark); 
            margin-bottom: 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 4rem; 
        }

        .producto h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .producto p { font-size: 1rem; margin-bottom: 1rem; height: 60px; }
        
        .precio { 
            font-size: 2rem; 
            font-weight: 900; 
            color: var(--main-color); 
            margin-bottom: 1rem; 
            display: block; 
            text-shadow: 2px 2px 0px var(--dark); 
        }
        
        .btn-comprar { 
            display: inline-block; 
            background: var(--yellow); 
            color: var(--dark); 
            font-size: 1.2rem; 
            font-weight: 900; 
            padding: 1rem 2rem; 
            border: 4px solid var(--dark); 
            text-decoration: none; 
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s; 
        }

        .btn-comprar:hover { 
            background: var(--dark); 
            color: var(--yellow); 
        }
    
        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 768px) { 
            .theme-control { 
                top: 0.8rem; 
                right: 0.8rem; 
                padding: 0.4rem 0.8rem; 
                font-size: 1rem; 
            } 
            
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- CONTROLES SUPERIORES -->
    <button class="theme-control" id="themeBtn" onclick="toggleTheme()">🌚</button>
    <a href="index.html" class="back-btn">← VOLVER AL REDIL</a>

    <!-- CABECERA DE LA TIENDA -->
    <div class="header-tienda">
        
        <h1>Tienda Oficial</h1>
        
        <p class="subtitulo">
            Financia nuestra decadencia comprando trozos de plástico y papel adhesivo.
        </p>

        <!-- CARTEL: EN OBRAS -->
        <div class="cartel-obras">
            🚧 ¡ESTAMOS EN OBRAS! 🚧 <br>
            <span style="font-size: 1.1rem; font-weight: normal; display: block; margin-top: 1rem; line-height: 1.5;">
                Nuestros monos informáticos están montando el TPV para que puedas darnos tu dinero de forma segura. <br><br>
                <strong>Vuelve pronto para ver el merchandising.</strong>
            </span>
        </div>

    </div>

    <!-- LISTADO DE PRODUCTOS (VACÍO POR AHORA) -->
    <div class="grid-tienda">
        <!-- 
           Aquí irán las cajas con <div class="producto"> 
           cuando la tienda esté lista para funcionar. 
        -->
    </div>

    <!-- SCRIPTS -->
    <script>
        /* ==========================================
           GESTIÓN DEL MODO OSCURO (PERSISTENTE)
           ========================================== */
           
        function aplicarTema() {
            const isDark = localStorage.getItem('borregos_dark_mode') === 'true';
            document.body.classList.toggle('dark-mode', isDark);
            
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerText = isDark ? '🌞' : '🌚';
            }
        }

        function toggleTheme() {
            const isDark = !document.body.classList.contains('dark-mode');
            
            document.body.classList.toggle('dark-mode', isDark);
            localStorage.setItem('borregos_dark_mode', isDark);
            
            document.getElementById('themeBtn').innerText = isDark ? '🌞' : '🌚';
        }

        // Ejecutar al cargar la página
        aplicarTema();
    </script>
</body>
</html>
